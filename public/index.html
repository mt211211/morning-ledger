<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#10231d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ledger">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/icon-192.svg">
    <link rel="stylesheet" href="/styles.css">
    <title>Morning Ledger</title>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Your finance briefing</p>
        <h1>Morning Ledger</h1>
      </div>
      <button class="icon-button" id="refreshButton" aria-label="Refresh news">
        <span id="refreshIcon">↻</span>
      </button>
    </header>

    <main>
      <section class="hero">
        <p class="hero-date" id="today"></p>
        <h2>Good morning.<br><span>Here is what matters.</span></h2>
        <div class="hero-meta">
          <span class="pulse"></span>
          <span id="refreshStatus">Checking your latest digest...</span>
        </div>
      </section>

      <nav class="chips" aria-label="Finance topics">
        <button class="chip active" data-category="all">Top stories</button>
        <button class="chip" data-category="markets">Markets</button>
        <button class="chip" data-category="companies">Companies</button>
        <button class="chip" data-category="economy">Economy</button>
        <button class="chip" data-category="personal-finance">Personal finance</button>
        <button class="chip" data-category="crypto">Crypto</button>
      </nav>

      <section class="section-heading">
        <div>
          <p class="eyebrow">Daily briefing</p>
          <h2>Latest stories</h2>
        </div>
        <span id="storyCount"></span>
      </section>
      <section class="story-list" id="stories" aria-live="polite"></section>
    </main>

    <button class="ask-fab" id="openChat">Ask Ledger <span>✦</span></button>

    <dialog id="chatDialog">
      <section class="chat-shell">
        <header class="chat-header">
          <div>
            <p class="eyebrow">Grounded in your digest</p>
            <h2>Ask Ledger</h2>
          </div>
          <button class="close-button" id="closeChat" aria-label="Close chat">×</button>
        </header>
        <div class="chat-messages" id="messages">
          <div class="message assistant">Ask me what changed today, why a story matters, or how several updates connect. I will link the sources I use.</div>
        </div>
        <form class="chat-form" id="chatForm">
          <input id="question" maxlength="500" placeholder="What should I know about markets today?" required>
          <button aria-label="Send question">↑</button>
        </form>
      </section>
    </dialog>

    <template id="storyTemplate">
      <article class="story-card">
        <div class="story-topline">
          <span class="topic"></span>
          <time></time>
        </div>
        <h3></h3>
        <p class="summary"></p>
        <footer>
          <div>
            <span class="source"></span>
            <span class="source-tier"></span>
          </div>
          <a target="_blank" rel="noopener noreferrer">Read article <span>↗</span></a>
        </footer>
        <button class="story-question">Ask AI about this</button>
      </article>
    </template>
    <script type="module" src="/app.js"></script>
  </body>
</html>
